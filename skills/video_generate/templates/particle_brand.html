<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brand Animation</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: {{BG_COLOR}}; overflow: hidden; font-family: "Microsoft YaHei", sans-serif; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const W = {{WIDTH}};
const H = {{HEIGHT}};
const PRIMARY = "{{PRIMARY_COLOR}}";
const BG = "{{BG_COLOR}}";
const BRAND_NAME = "{{BRAND_NAME}}";
const SUBTITLE = "{{SUBTITLE}}";
const TAGLINE = "{{TAGLINE}}";
const PARTICLE_COUNT = {{PARTICLE_COUNT}};
const REVEAL_STYLE = "{{REVEAL_STYLE}}";
const GLOW = {{GLOW_INTENSITY}};

const canvas = document.getElementById("c");
canvas.width = W;
canvas.height = H;
const ctx = canvas.getContext("2d");
const cx = W / 2;
const cy = H / 2;

// 粒子
const particles = [];
for (let i = 0; i < PARTICLE_COUNT; i++) {
  const angle = Math.random() * Math.PI * 2;
  const dist = 300 + Math.random() * 800;
  particles.push({
    x: cx + Math.cos(angle) * dist,
    y: cy + Math.sin(angle) * dist,
    tx: cx + (Math.random() - 0.5) * {{TEXT_SPREAD}},
    ty: cy + (Math.random() - 0.5) * {{TEXT_SPREAD}},
    size: Math.random() * 3 + 1.5,
    delay: Math.random() * 0.4,
    alpha: Math.random() * 0.5 + 0.5,
    hue: Math.random() * 30 - 15,
    arrived: false,
    pulse: Math.random() * Math.PI * 2,
  });
}

// 网格线
const gridLines = [];
for (let i = 0; i < {{GRID_COUNT}}; i++) {
  gridLines.push({
    x1: Math.random() * W, y1: Math.random() * H,
    x2: Math.random() * W, y2: Math.random() * H,
    alpha: Math.random() * 0.05 + 0.02,
  });
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return [r, g, b];
}
const [pr, pg, pb] = hexToRgb(PRIMARY);
const [br, bg, bb] = hexToRgb(BG);

let frame = 0;
function draw() {
  // 背景
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, W);
  grad.addColorStop(0, `rgba(${Math.min(br+20,255)},${Math.min(bg+20,255)},${Math.min(bb+20,255)},1)`);
  grad.addColorStop(1, `rgba(${br},${bg},${bb},1)`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // 网格
  gridLines.forEach(l => {
    ctx.strokeStyle = `rgba(${pr},${pg},${pb},${l.alpha})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(l.x1, l.y1);
    ctx.lineTo(l.x2, l.y2);
    ctx.stroke();
  });

  // 粒子
  const progress = Math.min(frame / ({{DURATION}} * {{FPS}}), 1);
  particles.forEach(p => {
    if (progress < p.delay) return;
    const tp = Math.min((progress - p.delay) / (1 - p.delay), 1);
    const ease = 1 - Math.pow(1 - tp, 3);
    p.x = p.x + (p.tx - p.x) * ease;
    p.y = p.y + (p.ty - p.y) * ease;
    p.arrived = ease >= 0.95;

    ctx.save();
    if (p.arrived) {
      p.pulse += 0.03;
      const pulse = Math.sin(p.pulse) * 0.4 + 0.6;
      ctx.globalAlpha = p.alpha * (0.7 + pulse * 0.3);
      ctx.shadowColor = PRIMARY;
      ctx.shadowBlur = 15 * pulse * GLOW;
    } else {
      ctx.globalAlpha = p.alpha * 0.8;
      ctx.shadowBlur = 0;
    }
    ctx.fillStyle = PRIMARY;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });

  // 品牌名
  if (progress > 0.4) {
    const tp = Math.min((progress - 0.4) / 0.35, 1);
    if (REVEAL_STYLE === "typewriter") {
      drawTypewriter(BRAND_NAME, cx, cy - 20, "bold {{TITLE_SIZE}}px", tp, PRIMARY);
    } else {
      ctx.save();
      ctx.globalAlpha = REVEAL_STYLE === "fade_in" ? tp : 1 - Math.pow(1 - tp, 3);
      ctx.fillStyle = PRIMARY;
      ctx.font = "bold {{TITLE_SIZE}}px 'Microsoft YaHei', sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.shadowColor = PRIMARY;
      ctx.shadowBlur = 30 * GLOW * tp;
      ctx.fillText(BRAND_NAME, cx, cy - 20);
      ctx.restore();
    }
  }

  // 副标题
  if (progress > 0.6) {
    const tp = Math.min((progress - 0.6) / 0.3, 1);
    ctx.save();
    ctx.globalAlpha = tp;
    ctx.fillStyle = "#e0e0e0";
    ctx.font = "bold 36px 'Microsoft YaHei', sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(SUBTITLE, cx, cy + 50);
    ctx.restore();
  }

  // 英文标语
  if (progress > 0.7 && TAGLINE) {
    const tp = Math.min((progress - 0.7) / 0.3, 1);
    ctx.save();
    ctx.globalAlpha = tp * 0.7;
    ctx.fillStyle = "#888888";
    ctx.font = "20px 'Microsoft YaHei', sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(TAGLINE, cx, cy + 90);
    ctx.restore();
  }

  frame++;
  if (frame < {{DURATION}} * {{FPS}} + 10) {
    requestAnimationFrame(draw);
  }
}

function drawTypewriter(text, x, y, font, progress, color) {
  const charsToShow = Math.floor(text.length * progress);
  ctx.save();
  ctx.font = font;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = color;
  ctx.shadowColor = color;
  ctx.shadowBlur = 25 * GLOW * progress;
  const fullWidth = ctx.measureText(text).width;
  const shown = text.substring(0, charsToShow);
  const shownWidth = ctx.measureText(shown).width;
  ctx.fillText(shown, x - (fullWidth - shownWidth) / 2, y);
  // 光标
  if (charsToShow < text.length && Math.floor(Date.now() / 120) % 2 === 0) {
    const charW = ctx.measureText(text[charsToShow]).width;
    ctx.fillRect(x - fullWidth / 2 + shownWidth + charW + 4, y - 60, 3, 120);
  }
  ctx.restore();
}

window.CURRENT_FRAME = 0;
window.updateAnimation = draw;
draw();
</script>
</body>
</html>
