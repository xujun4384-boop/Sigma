<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Counter</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: {{WIDTH}}px; height: {{HEIGHT}}px;
  background: {{BG_COLOR}};
  display: flex; flex-direction: column;
  justify-content: center; align-items: center;
  font-family: "Microsoft YaHei", sans-serif;
  overflow: hidden;
}
.container { text-align: center; color: white; padding: 60px; }
.title {
  font-size: {{TITLE_SIZE}}px; font-weight: bold;
  margin-bottom: 80px; min-height: 120px; line-height: 1.3;
}
.typewriter-text {
  overflow: hidden; border-right: 4px solid {{ACCENT_COLOR}};
  white-space: nowrap; display: inline-block;
  animation: blink 0.75s step-end infinite;
}
@keyframes blink {
  from, to { border-color: transparent; }
  50% { border-color: {{ACCENT_COLOR}}; }
}
.subtitle {
  font-size: 36px; margin-bottom: 80px;
  opacity: 0; transition: opacity 1.5s, transform 1.5s;
  transform: translateY(30px); color: rgba(255,255,255,0.9);
}
.subtitle.show { opacity: 1; transform: translateY(0); }
.stats {
  display: flex; flex-direction: column; gap: 60px;
  opacity: 0; transition: opacity 1.5s, transform 1.5s;
  transform: translateY(30px);
}
.stats.show { opacity: 1; transform: translateY(0); }
.stat-item {
  background: rgba(255,255,255,0.08);
  border-radius: 20px; padding: 40px 80px;
}
.stat-value {
  font-size: {{STAT_SIZE}}px;
  font-weight: bold; color: {{ACCENT_COLOR}};
  text-shadow: 0 4px 30px {{ACCENT_GLOW}};
  margin-bottom: 16px;
}
.stat-label { font-size: 32px; color: rgba(255,255,255,0.85); }
</style>
</head>
<body>
<div class="container">
  <h1 class="title" id="title"></h1>
  <p class="subtitle" id="sub">{{SUBTITLE}}</p>
  <div class="stats" id="stats"></div>
</div>
<script>
const TITLE = "{{TITLE_TEXT}}";
const TITLE_DUR = {{TITLE_FRAMES}};
const SUB_DUR = {{SUB_FRAMES}};
const STAT_DUR = {{STAT_FRAMES}};
const NUM_DUR = {{NUM_FRAMES}};
const TOTAL_DUR = {{DURATION}};

const STATS = JSON.parse('{{STATS_JSON}}');

window.CURRENT_FRAME = 0;

function updateAnimation() {
  const f = window.CURRENT_FRAME;

  // 标题打字机
  const tp = Math.min(f / TITLE_DUR, 1);
  const ci = Math.floor(tp * TITLE.length);
  document.getElementById("title").innerHTML =
    '<span class="typewriter-text">' + TITLE.substring(0, ci) + '</span>';

  // 副标题淡入
  if (f >= TITLE_DUR) {
    document.getElementById("sub").classList.add("show");
  }

  // 统计区域
  const statsEl = document.getElementById("stats");
  if (f >= SUB_DUR) {
    statsEl.classList.add("show");
    if (!statsEl.children.length) {
      STATS.forEach(s => {
        const item = document.createElement("div");
        item.className = "stat-item";
        item.innerHTML = '<div class="stat-value" id="v_' + s.key + '">0</div>' +
                         '<div class="stat-label">' + s.label + '</div>';
        statsEl.appendChild(item);
      });
    }
  }

  // 数字滚动
  if (f >= NUM_DUR) {
    const np = Math.min((f - NUM_DUR) / (TOTAL_DUR * 30 - NUM_DUR), 1);
    const ep = 1 - Math.pow(2, -10 * np);
    STATS.forEach(s => {
      const val = Math.floor(s.value * ep);
      const el = document.getElementById("v_" + s.key);
      if (el) el.textContent = val.toLocaleString();
    });
  }
}

updateAnimation();
</script>
</body>
</html>
