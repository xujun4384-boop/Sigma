<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sigma Computer Use</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; overflow: hidden;
    background: #141518; color: #e8eaed;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
    font-size: 13px; user-select: none;
  }
  body { display: flex; flex-direction: column; }

  /* 顶栏（可拖动） */
  .bar {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; background: #1b1d21;
    border-bottom: 1px solid #34383e; -webkit-app-region: drag;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #6b7280; flex: none; }
  .dot.running { background: #34c759; animation: pulse 1.1s infinite; }
  .dot.paused { background: #f5c451; }
  .dot.taken_over { background: #4fc3f7; }
  .dot.stopped { background: #ef4444; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
  .title { font-weight: 600; font-size: 13px; }
  .state { color: #9aa1ab; font-size: 12px; margin-left: auto; }
  .win-btn {
    -webkit-app-region: no-drag;
    width: 26px; height: 22px; border: none; border-radius: 5px;
    background: #2a2d33; color: #c9ced6; cursor: pointer; font-size: 13px;
  }
  .win-btn:hover { background: #3a3e45; }
  .win-btn.close:hover { background: #e5484d; color: #fff; }

  /* 实时画面 */
  .view {
    position: relative; background: #0c0d0f; flex: none;
    height: 300px; display: flex; align-items: center; justify-content: center;
    border-bottom: 1px solid #34383e; overflow: hidden;
  }
  .view img { width: 100%; height: 100%; object-fit: contain; display: none; }
  .noframe { color: #4b5057; font-size: 12px; }
  .badge {
    position: absolute; left: 8px; bottom: 8px; max-width: calc(100% - 16px);
    padding: 3px 8px; border-radius: 999px; background: rgba(0,0,0,.55);
    color: #cfd4da; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .warn {
    display: none; position: absolute; top: 8px; left: 8px; right: 8px;
    padding: 6px 9px; border-radius: 6px; background: rgba(229,72,77,.14);
    color: #ffb4b6; font-size: 11px; line-height: 1.5;
  }

  .pad { padding: 10px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
  .row { display: flex; gap: 6px; }
  input {
    flex: 1; min-width: 0; background: #1b1d21; border: 1px solid #34383e;
    border-radius: 7px; padding: 8px 10px; color: #e8eaed; font-size: 13px; outline: none;
  }
  input:focus { border-color: #4fc3f7; }
  button.act {
    border: 1px solid #34383e; background: #23262b; color: #dfe3e8;
    border-radius: 7px; padding: 8px 12px; cursor: pointer; font-size: 13px; white-space: nowrap;
  }
  button.act:hover { background: #2c3037; }
  button.act.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
  button.act.primary:hover { background: #1d4ed8; }
  button.act:disabled { opacity: .45; cursor: not-allowed; }

  .logbox summary { cursor: pointer; color: #9aa1ab; font-size: 12px; padding: 2px 0; }
  .logbox { border-top: 1px solid #24272c; padding-top: 6px; }
  #log { max-height: 160px; overflow-y: auto; font-size: 11px; color: #9aa1ab; line-height: 1.7; font-family: ui-monospace, monospace; }
  #log .ok { color: #6ee7a0; }
  #log .bad { color: #ffb4b6; }

  .result-title { font-size: 12px; font-weight: 600; color: #cfd4da; padding-top: 2px; }
  .dialog { font-size: 12px; color: #c6ccd4; line-height: 1.65; white-space: pre-wrap; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #34383e; border-radius: 4px; }
</style>
</head>
<body>
  <header class="bar">
    <div class="dot" id="statusDot"></div>
    <span class="title">Computer Use</span>
    <span class="state" id="stateText">空闲</span>
    <button class="win-btn" id="btnMin" title="最小化">–</button>
    <button class="win-btn close" id="btnClose" title="退出模式">✕</button>
  </header>

  <section class="view">
    <img id="live" alt="screen" />
    <div class="noframe" id="noFrame">等待画面…</div>
    <div class="badge" id="taskBadge" style="display:none"></div>
    <div class="warn" id="warn"></div>
  </section>

  <div class="pad">
    <div class="row">
      <input id="goal" placeholder="输入任务，例如：打开记事本，输入今天的日期并保存到桌面" />
      <button class="act primary" id="btnStart">开始</button>
    </div>
    <div class="row">
      <button class="act" id="btnPause">暂停</button>
      <button class="act" id="btnTakeover">接管</button>
      <button class="act" id="btnStop">停止</button>
    </div>
    <div class="row">
      <input id="correct" placeholder="纠正：例如 不要点登录，先点右上角的设置" />
      <button class="act" id="btnCorrect">发送纠正</button>
    </div>

    <details class="logbox" id="logDetails" open>
      <summary>动作日志</summary>
      <div id="log"></div>
    </details>
    <div class="result-title" id="resultTitle" style="display:none">结果</div>
    <div class="dialog" id="dialog"></div>
  </div>

<script>
  const { ipcRenderer } = require('electron')
  const port = new URLSearchParams(location.search).get('port') || '8765'
  const BASE = `http://127.0.0.1:${port}`

  const el = (id) => document.getElementById(id)
  const statusDot = el('statusDot'), stateText = el('stateText')
  const live = el('live'), noFrame = el('noFrame'), taskBadge = el('taskBadge'), warn = el('warn')
  const logBox = el('log'), dialog = el('dialog')
  const goal = el('goal'), correct = el('correct')
  const logDetails = el('logDetails'), resultTitle = el('resultTitle')
  const btnStart = el('btnStart'), btnPause = el('btnPause'), btnTakeover = el('btnTakeover'), btnStop = el('btnStop'), btnCorrect = el('btnCorrect')

  const STATE_LABEL = { idle: '空闲', running: '运行中', paused: '已暂停', taken_over: '已接管', stopped: '已停止' }
  let lastFrameTs = 0
  let lastLogTs = 0
  let busy = false

  // ── 窗口按钮 ──
  el('btnMin').onclick = () => ipcRenderer.invoke('computer-use-minimize')
  el('btnClose').onclick = () => ipcRenderer.invoke('exit-computer-use-mode')

  // ── 状态轮询 ──
  async function poll() {
    try {
      const r = await fetch(`${BASE}/api/computer-use/frame`)
      const s = await r.json()
      applyState(s)
    } catch (e) {
      stateText.textContent = '连接中…'
    }
  }

  function applyState(s) {
    const st = s.state || 'idle'
    statusDot.className = 'dot ' + st
    stateText.textContent = STATE_LABEL[st] || st

    // 画面
    if (s.frame_url) {
      const ts = (s.frame && s.frame.ts) || 0
      if (ts !== lastFrameTs) { lastFrameTs = ts; live.src = s.frame_url }
      live.style.display = 'block'; noFrame.style.display = 'none'
    } else {
      live.style.display = 'none'; noFrame.style.display = 'block'
    }

    // 任务徽标
    if (s.task) { taskBadge.style.display = 'block'; taskBadge.textContent = '任务：' + s.task }
    else taskBadge.style.display = 'none'

    // 按钮态
    btnPause.textContent = st === 'paused' ? '继续' : '暂停'
    btnPause.disabled = st === 'stopped'
    btnTakeover.textContent = st === 'taken_over' ? '交还' : '接管'
    btnTakeover.disabled = st === 'stopped'
    btnStop.disabled = (st === 'stopped' || st === 'idle')

    // 日志
    const logs = s.log || []
    const newest = logs.length ? logs[logs.length - 1].ts : 0
    if (newest !== lastLogTs) {
      lastLogTs = newest
      logBox.innerHTML = logs.map(x => {
        const cls = x.ok ? 'ok' : 'bad'
        const t = new Date(x.ts * 1000).toLocaleTimeString('zh-CN', { hour12: false })
        return `<div><span class="${cls}">●</span> ${t} ${escapeHtml(x.action)} · ${escapeHtml(x.detail || '')}</div>`
      }).join('')
      logBox.scrollTop = logBox.scrollHeight  // 自动滚动到最新一条
    }

    // 能力警告
    if (s.capabilities && s.capabilities.input === false) {
      warn.style.display = 'block'
      warn.textContent = '⚠ 未检测到 pyautogui，鼠标/键盘/截图不可用。请在后端环境执行：pip install pyautogui pyperclip'
    }
  }

  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
  }

  // ── 控制指令 ──
  async function control(action, text) {
    try {
      const r = await fetch(`${BASE}/api/computer-use/control`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action, text: text || '' }),
      })
      const j = await r.json()
      if (j.state) applyState({ state: j.state })
    } catch (e) { /* ignore */ }
  }

  btnPause.onclick = () => control(btnPause.textContent === '继续' ? 'resume' : 'pause')
  btnTakeover.onclick = () => control(btnTakeover.textContent === '交还' ? 'handback' : 'takeover')
  btnStop.onclick = () => control('stop')
  btnCorrect.onclick = () => {
    const t = correct.value.trim()
    if (!t) return
    control('correct', t)
    correct.value = ''
    dialog.textContent = '已发送纠正，Agent 将在下一步响应。'
  }
  correct.addEventListener('keydown', e => { if (e.key === 'Enter') btnCorrect.click() })

  // ── 发起任务（读取 SSE 流） ──
  async function startTask() {
    const msg = goal.value.trim()
    if (!msg || busy) return
    busy = true; btnStart.disabled = true; btnStart.textContent = '运行中'
    dialog.textContent = ''
    resultTitle.style.display = 'none'
    logDetails.open = true
    try {
      const resp = await fetch(`${BASE}/api/computer-use/chat`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: msg }),
      })
      const ct = resp.headers.get('content-type') || ''
      if (!resp.ok || ct.includes('application/json')) {
        const j = await resp.json().catch(() => ({}))
        dialog.textContent = '✕ ' + (j.error || `HTTP ${resp.status}`)
        return
      }
      const reader = resp.body.getReader()
      const dec = new TextDecoder()
      let buf = ''
      while (true) {
        const { done, value } = await reader.read()
        if (done) break
        buf += dec.decode(value, { stream: true })
        let idx
        while ((idx = buf.indexOf('\n\n')) >= 0) {
          const chunk = buf.slice(0, idx); buf = buf.slice(idx + 2)
          if (!chunk.startsWith('data: ')) continue
          try { handleEvent(JSON.parse(chunk.slice(6))) } catch (e) { /* ignore */ }
        }
      }
    } catch (e) {
      dialog.textContent = '✕ ' + e.message
    } finally {
      busy = false; btnStart.disabled = false; btnStart.textContent = '开始'
    }
  }

  function handleEvent(ev) {
    if (!ev || !ev.type) return
    if (ev.type === 'text' && ev.content) {
      dialog.textContent += ev.content
    } else if (ev.type === 'tool_use' || ev.type === 'tool_start') {
      dialog.textContent += `\n▸ ${ev.name || ev.tool_name || 'tool'}`
    } else if (ev.type === 'tool_result') {
      dialog.textContent += `\n  · ${ev.success === false ? '失败' : '完成'}`
    } else if (ev.type === 'chat_complete') {
      dialog.textContent += '\n— 任务结束 —'
      logDetails.open = false
    } else if (ev.type === 'error') {
      dialog.textContent += `\n✕ ${ev.content || ev.error || 'error'}`
    }
    resultTitle.style.display = dialog.textContent.trim() ? 'block' : 'none'
    dialog.scrollTop = dialog.scrollHeight
  }

  btnStart.onclick = startTask
  goal.addEventListener('keydown', e => { if (e.key === 'Enter') startTask() })

  // 主进程可通知窗口隐藏/显示（预留）
  setInterval(poll, 700)
  poll()
</script>
</body>
</html>
