<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sigma</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #1a1b1e;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-app-region: drag;
  }

  .splash-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    padding: 48px;
  }

  .splash-logo {
    width: 96px;
    height: 96px;
    animation: logo-in 0.6s ease-out;
    -webkit-user-drag: none;
  }

  @keyframes logo-in {
    from { opacity: 0; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1); }
  }

  .splash-title {
    font-size: 28px;
    font-weight: 700;
    color: #e8eaed;
    letter-spacing: -0.5px;
    animation: fade-up 0.5s ease-out 0.2s both;
  }

  .splash-version {
    font-size: 12px;
    color: #6b7280;
    margin-top: -20px;
    animation: fade-up 0.5s ease-out 0.3s both;
  }

  @keyframes fade-up {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .splash-status {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    min-height: 60px;
  }

  .status-line {
    font-size: 13px;
    color: #9aa0a6;
    display: flex;
    align-items: center;
    gap: 8px;
    animation: fade-up 0.4s ease-out both;
  }

  .status-line .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #4fc3f7;
    flex-shrink: 0;
    animation: dot-pulse 1.2s ease-in-out infinite;
  }

  .status-line.done .dot {
    background: #66bb6a;
    animation: none;
  }

  .status-line.active {
    color: #e8eaed;
  }

  .status-line.pending {
    color: #4a4d52;
  }

  .status-line.pending .dot {
    background: #4a4d52;
    animation: none;
  }

  @keyframes dot-pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }

  .splash-progress {
    width: 200px;
    height: 2px;
    background: rgba(79, 195, 247, 0.1);
    border-radius: 1px;
    overflow: hidden;
    margin-top: 4px;
  }

  .splash-progress .bar {
    height: 100%;
    background: #4fc3f7;
    border-radius: 1px;
    transition: width 0.5s ease;
    width: 0%;
  }
</style>
</head>
<body>
<div class="splash-container">
  <img class="splash-logo" src="../icon.png" alt="Sigma" />

  <div class="splash-version">AI Assistant</div>

  <div class="splash-status" id="status">
    <div class="status-line active" id="line-backend">
      <span class="dot"></span>
      <span>Starting Python backend</span>
    </div>
    <div class="status-line pending" id="line-wait">
      <span class="dot"></span>
      <span>Waiting for backend</span>
    </div>
    <div class="status-line pending" id="line-frontend">
      <span class="dot"></span>
      <span>Loading user interface</span>
    </div>
  </div>

  <div class="splash-progress">
    <div class="bar" id="progress-bar"></div>
  </div>
</div>

<script>
  const { ipcRenderer } = require('electron')

  const lines = {
    backend: document.getElementById('line-backend'),
    wait: document.getElementById('line-wait'),
    frontend: document.getElementById('line-frontend'),
  }

  const bar = document.getElementById('progress-bar')

  const steps = ['backend', 'wait', 'frontend']
  let current = -1

  ipcRenderer.on('splash-status', (event, data) => {
    const { step, text, done } = data
    const idx = steps.indexOf(step)
    if (idx < 0) return

    current = idx
    const el = lines[step]
    if (!el) return

    // Mark previous steps as done
    for (let i = 0; i < idx; i++) {
      lines[steps[i]].classList.remove('active', 'pending')
      lines[steps[i]].classList.add('done')
    }

    // Current step
    el.classList.remove('pending')
    el.classList.add('active')
    if (done) {
      el.classList.remove('active')
      el.classList.add('done')
    }
    if (text) {
      el.querySelector('span:last-child').textContent = text
    }

    // Update progress bar
    const pct = done
      ? ((idx + 1) / steps.length * 100)
      : ((idx + 0.5) / steps.length * 100)
    bar.style.width = pct + '%'
  })
</script>
</body>
</html>
